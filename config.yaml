# AkkuNet — single source of truth for all settings.
# Relative paths are resolved relative to the folder this file lives in.

project_name: AkkuNet

paths:
  raw_videos: data/raw_videos      # one subfolder per recording session
  raw_photos: data/raw_photos      # own photos for TRAINING ONLY: train_only_<YYYY-MM-DD>[_note]/
  dataset: data/dataset            # extracted frames: images/<split>/..., later labels/<split>/...
  reports: reports
  external: data/external          # public dataset exports, as downloaded (one folder per dataset)
  class_maps: configs/class_maps   # <dataset>.yaml: source class -> our class / null (drop)
  bootstrap: data/bootstrap        # imported public data for the bootstrap model ONLY
  env_file: .env                   # local secrets (Telegram token, chat IDs); NEVER committed
  escalation_db: data/escalation/events.sqlite
  escalation_snapshots: data/escalation/snapshots      # may show people: git-ignored
  hard_negative_candidates: data/escalation/hard_negative_candidates

# Class order matters: the index in this list is the YOLO class ID.
classes:
  - vape
  - power_bank
  - battery_pack
  - tool_battery
  - loose_cell

# "auto" picks CUDA -> Apple MPS -> CPU. Or force one: "cpu", "mps", "cuda".
device: auto

# ---------------------------------------------------------------- Stage 1
frame_extraction:
  every_n_frames: 15              # at 30 fps this is 2 frames per second
  video_extensions: [.mp4, .mov, .m4v, .avi, .mkv]
  photo_extensions: [.jpg, .jpeg, .png]   # iPhone: export as JPEG ("Most Compatible"), not HEIC
  jpeg_quality: 95
  # Blur filter: variance of the Laplacian, measured on a copy resized so its
  # long side is blur_measure_long_side px (so the threshold does not depend on
  # the phone's resolution). Lower = blurrier. Tune by looking at the
  # "median blur" column in the summary and at the frames that get removed.
  blur_threshold: 100.0
  blur_measure_long_side: 640
  # Near-duplicate filter: difference hash (dHash) with hash_size x hash_size
  # bits. A frame is dropped if its hash is within hamming_threshold bits of any
  # frame already kept from the same session. 16x16 = 256 bits; 10 bits ~ 4%.
  hash_size: 16
  hamming_threshold: 10

# Split BY SESSION (never by frame). List session folder names here.
# Every session not listed under val/test/shift_test goes to train.
splits:
  val_sessions: []
  test_sessions: []
  # At least one session filmed on a background / lighting NOT used in any
  # other split. Used to measure how much performance drops under shift.
  shift_test_sessions: []

# ---------------------------------------------------------------- Bootstrap (Part B2)
# A first model trained ONLY on public data, to have something for the webcam
# demo before own footage is labelled. Its scores say nothing about the
# tipping floor. The exports' own splits leak (mirrored/rotated copies of one
# image in train and valid), so all kept images are pooled, near-copies are
# grouped, and whole groups are split into train / bootstrap_val.
bootstrap:
  datasets: [battery_and_vape, kashif_battery]
  model: yolo11n.pt        # nano, COCO-pretrained
  imgsz: 640
  epochs: 60
  batch: 16
  patience: 15             # stop early if val mAP has not improved for this many epochs
  seed: 0
  val_fraction: 0.15       # share of every class's images in bootstrap_val
  near_copy_hamming: 10    # dHash bits (of 256) within which two images count as copies

# ---------------------------------------------------------------- Live demo (Part B3)
demo:
  # Relative to this config file. Override with --weights.
  weights: runs/bootstrap/bootstrap_v1/weights/best.pt
  source: 0                # webcam index (0 = built-in camera) or a video file path
  imgsz: 640
  detect_conf: 0.25        # boxes below this are not drawn or tracked
  tracker: bytetrack.yaml  # Ultralytics' built-in ByteTrack settings
  # Alert rule: a track raises ONE alert once it has been seen in at least
  # alert_min_frames frames with confidence >= alert_conf. A single
  # high-confidence flicker therefore never alerts.
  alert_conf: 0.5
  alert_min_frames: 5
  alert_classes: []        # empty = every class of the model
  banner_seconds: 3.0      # how long the red banner stays after an alert
  # Sound when an alert fires (same rule as the red banner). Played in the
  # background, so the video never freezes. Override with --audio.
  audio:
    mode: beep             # beep (afplay a sound file) | voice (macOS `say`) | off
    cooldown_seconds: 5.0  # at most one sound per this many seconds, even if several tracks alert
    beep_sound: /System/Library/Sounds/Sosumi.aiff
    voice: Anna            # `say -v '?'` lists the installed voices
    voice_text: "Achtung: möglicher Akku erkannt"
    # If true, say voice_text_with_class instead, with {name} = the class's spoken name.
    say_class_name: false
    voice_text_with_class: "Achtung: {name} erkannt"
    spoken_class_names:
      vape: E-Zigarette
      power_bank: Powerbank
      battery_pack: Akkupack
      tool_battery: Werkzeugakku
      loose_cell: Batterie

# ---------------------------------------------------------------- Fire/smoke escalation
# HUMAN-IN-THE-LOOP ONLY. The software NEVER calls 112 or any other number. It
# alerts a responsible person, who confirms or dismisses; on confirmation they get
# the number and a text to read out and call from their own phone. A real site
# must use its certified fire alarm system instead (docs/fire_escalation.md).
escalation:
  enabled: true
  channel: console         # console = demo/test default (no network) | telegram (needs .env)
  # No smoke model yet: in the demo window, key "s" toggles SIMULATED smoke.
  trigger_min_frames: 15   # consecutive frames with smoke before an incident opens
  response_timeout_seconds: 90   # then: secondary contact + site alarm
  zone: "Kipphalle, Bereich 1 (DEMO)"
  facility:                # DEMO values: replace for a real pilot
    name: "AkkuNet Demo-Anlage"
    address: "Musterstraße 1, 12345 Musterstadt"
    emergency_number: "112"
  contacts:                # Telegram chat IDs come from .env, never from this file
    primary:
      name: Schichtleitung
      telegram_chat_id_env: TELEGRAM_CHAT_ID_PRIMARY
    secondary:
      name: Betriebsleitung
      telegram_chat_id_env: TELEGRAM_CHAT_ID_SECONDARY
  site_alarm:
    sound: /System/Library/Sounds/Funk.aiff
    repeats: 10            # demo: plays the sound 10x at full volume
